name: Publish

# Release flow: pushing a vX.Y.Z tag runs the gates and publishes to npm.
# See docs/PUBLISHING.md for the full runbook.
on:
  push:
    tags:
      - "v*"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tsc --noEmit

  publish:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org/"
      - run: npm ci
      - name: Parity gates (release blocker)
        run: node scripts/verify.mjs
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
